name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend Quality Gates & Tests
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: sqlite:///ci_test.db
      SECRET_KEY: ci-secret-key-32-chars-minimum-length
      ENVIRONMENT: testing

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff Lint Check
        run: ruff check .

      - name: Run Mypy Type Check
        run: mypy rezekify

      - name: Run Database Migration Bootstrap
        run: python -m rezekify.db.init_db

      - name: Run Pytest Test Suite
        run: pytest -v

  frontend-ci:
    name: Frontend Quality Gates & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node Dependencies
        run: npm ci --legacy-peer-deps

      - name: Run TypeScript Typecheck
        run: npx tsc --noEmit

      - name: Run Frontend Tests
        run: npm run test

      - name: Build Frontend Production Bundle
        run: npm run build
